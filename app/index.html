    <script>
      (function () {
        try {
          var k = 'devhub.theme';
          var p = localStorage.getItem(k);
          var r;
          if (p === 'light' || p === 'dark') r = p;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) r = 'light';
          else r = 'dark';
          document.documentElement.setAttribute('data-theme', r);
          document.documentElement.style.colorScheme = r;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = r === 'light' ? '#f4f4f5' : '#0a0a0c';
        } catch (e) {}
      })();
    </script>
