openapi: 3.1.0
info:
  title: DevHub API
  version: 1.0.0
  description: |
    DevHub API — project management for programming projects.
    Auth via httpOnly cookie (devhub_session). All endpoints JSON.
    The MCP endpoint (/mcp) is a Model Context Protocol streamable-HTTP server
    and is documented separately in docs/03-engineering/mcp-integration.md.
  contact:
    name: DevHub Project Owner
  license:
    name: TBD
servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://devhub.example.com/api
    description: Production (TBD)

tags:
  - name: Auth
    description: Registration, login, logout, session
  - name: Projects
    description: Project metadata CRUD
  - name: State
    description: Full project state (JSONB payload)
  - name: Export/Import
    description: JSON snapshots
  - name: Public
    description: Read-only endpoints for sharing a project with anyone — no auth required
  - name: Health
    description: Operational health

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive session cookie
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and clear session cookie
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Cookie cleared

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      operationId: me
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projects]
      summary: List my projects
      operationId: listProjects
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Project list (meta only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Project metadata
      operationId: getProject
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Project meta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Update project metadata
      operationId: updateProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated meta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Delete project (cascades state)
      operationId: deleteProject
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/state:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [State]
      summary: Full project state
      operationId: getState
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Full state document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [State]
      summary: Replace full project state (zod-validated)
      operationId: putState
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/State'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/export:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Export/Import]
      summary: Download JSON snapshot
      operationId: exportProject
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Snapshot (application/json, Content-Disposition attachment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDocument'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/import:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Export/Import]
      summary: Import a JSON snapshot (replaces state)
      operationId: importProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDocument'
      responses:
        '200':
          description: Imported; state replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Public]
      summary: Get public project meta (no login)
      operationId: getPublicProject
      description: |
        Returns project meta for a project with visibility set to public.
        Projects that are private or do not exist return 404 — the endpoint does
        not leak whether a project ID exists.
      responses:
        '200':
          description: Public project meta
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    type: object
                    required: [id, name, description, status, visibility, teamName, createdAt, updatedAt]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type: string
                      status:
                        type: string
                        enum: [active, archived]
                      visibility:
                        type: string
                        enum: [private, public]
                      prd:
                        type: object
                        nullable: true
                      teamName:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  /public/projects/{projectId}/state:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Public]
      summary: Get public project state (no login)
      operationId: getPublicProjectState
      description: Full project state for read-only public viewing. Returns 404 when the project is not public.
      responses:
        '200':
          description: Public project state
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    $ref: '#/components/schemas/State'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  db:
                    type: string
                    const: connected
                  uptime:
                    type: number
                required: [status, db, uptime]
        '503':
          description: Database unreachable

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: devhub_session
      description: JWT session cookie set by register/login

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (or not yours)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, INTERNAL]
            message:
              type: string
            details:
              type: array
              items:
                type: object
              description: Field-level errors (zod)

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
      additionalProperties: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      additionalProperties: false

    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    Project:
      type: object
      required: [id, name, status, visibility, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          nullable: true
        status:
          type: string
          enum: [active, archived]
        visibility:
          type: string
          enum: [private, public]
          default: private
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [active, archived]
          default: active
      additionalProperties: false

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        visibility:
          type: string
          enum: [private, public]
          maxLength: 2000
          nullable: true
        status:
          type: string
          enum: [active, archived]
      additionalProperties: false

    Base:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        authorId:
          type: string
          nullable: true
          description: "'me' in solo mode; user id in multi-user phase"

    Task:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [title, status]
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 200
            status:
              type: string
              enum: [todo, inProgress, review, done]
            priority:
              type: string
              enum: [low, medium, high, urgent]
            estimate:
              type: number
              minimum: 0
              description: Hours
            actualHours:
              type: number
              minimum: 0
            labels:
              type: array
              items:
                type: string
                maxLength: 50
            blockedBy:
              type: array
              items:
                type: string
                format: uuid
              description: Must reference existing task ids (zod cross-check)
            milestoneId:
              type: string
              format: uuid
              nullable: true
              description: Optional grouping milestone; null when unassigned

    Issue:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [title, severity, status]
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 200
            severity:
              type: string
              enum: [critical, high, medium, low]
            status:
              type: string
              enum: [open, reproduced, fixing, resolved, wontfix]
            reproduction:
              type: string
              maxLength: 5000
            linkedTaskId:
              type: string
              format: uuid
              nullable: true

    TestCase:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [name, status]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            taskId:
              type: string
              format: uuid
              nullable: true
            issueId:
              type: string
              format: uuid
              nullable: true
            steps:
              type: string
              maxLength: 5000
            expected:
              type: string
              maxLength: 5000
            status:
              type: string
              enum: [pass, fail, pending]

    TechEntry:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [name, version, category, status]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            version:
              type: string
              maxLength: 60
            category:
              type: string
              enum: [frontend, backend, database, tooling]
            status:
              type: string
              enum: [current, updateAvailable, majorUpgrade]
            notes:
              type: string
              maxLength: 2000

    Table:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            comment:
              type: string
              maxLength: 2000
            columns:
              type: array
              items:
                $ref: '#/components/schemas/Column'
            indexes:
              type: array
              items:
                type: string
                maxLength: 120

    Column:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          maxLength: 60
        nullable:
          type: boolean
          default: false
        primaryKey:
          type: boolean
          default: false
        default:
          type: string
          nullable: true
        comment:
          type: string
          maxLength: 2000
      additionalProperties: false

    Relation:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [fromTableId, fromColumnId, toTableId, toColumnId, cardinality]
          properties:
            fromTableId:
              type: string
              format: uuid
            fromColumnId:
              type: string
              format: uuid
            toTableId:
              type: string
              format: uuid
            toColumnId:
              type: string
              format: uuid
            cardinality:
              type: string
              enum: ['1:1', '1:N', 'N:M']
            onDelete:
              type: string
              enum: [cascade, setNull, restrict]
              default: restrict

    SchemaVersion:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [version, appliedAt]
          properties:
            version:
              type: string
              maxLength: 40
            appliedAt:
              type: string
              format: date-time
            notes:
              type: string
              maxLength: 2000

    Decision:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [title, status, context, options, decision, consequences, date]
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 200
            status:
              type: string
              enum: [proposed, accepted, rejected, superseded]
            context:
              type: string
              maxLength: 5000
            options:
              type: array
              items:
                type: string
                maxLength: 1000
            decision:
              type: string
              maxLength: 5000
            consequences:
              type: string
              maxLength: 5000
            date:
              type: string
              format: date

    Milestone:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [name, status]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            version:
              type: string
              maxLength: 40
              nullable: true
            targetDate:
              type: string
              format: date
              nullable: true
            status:
              type: string
              enum: [planned, inProgress, released]
            changelog:
              type: string
              maxLength: 20000
              nullable: true

    State:
      type: object
      required: [tasks, issues, testCases, techEntries, tables, columns, relations, schemaVersions, decisions, milestones]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        testCases:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        techEntries:
          type: array
          items:
            $ref: '#/components/schemas/TechEntry'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/Table'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        schemaVersions:
          type: array
          items:
            $ref: '#/components/schemas/SchemaVersion'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
      additionalProperties: false

    ExportDocument:
      type: object
      required: [meta, state]
      properties:
        meta:
          type: object
          required: [app, version, exportedAt, projectId]
          properties:
            app:
              type: string
              const: devhub
            version:
              type: string
            exportedAt:
              type: string
              format: date-time
            projectId:
              type: string
              format: uuid
        state:
          $ref: '#/components/schemas/State'
